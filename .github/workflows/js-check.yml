name: JavaScript Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-check:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript
        run: npx eslint "**/*.js"

      - name: Test calculator
        run: npm test
