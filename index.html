<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT-студия Сигнал</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <header>
    <h1>IT-студия «Сигнал»</h1>
    <p>Учебный сайт по DevOps</p>
    <a href="#calculator">Перейти к калькулятору</a>
  </header>

  <main>
    <section>
      <h2>Наши услуги</h2>
      <ul>
        <li>Создание сайтов</li>
        <li>Оформление страниц</li>
        <li>Поддержка сайта</li>
      </ul>
    </section>

    <section id="calculator">
      <h2>Простой калькулятор</h2>
      <label for="first">Первое число</label>
      <input id="first" type="number" step="any">

      <label for="operation">Действие</label>
      <select id="operation">
        <option value="add">Сложение</option>
        <option value="subtract">Вычитание</option>
        <option value="multiply">Умножение</option>
        <option value="divide">Деление</option>
      </select>

      <label for="second">Второе число</label>
      <input id="second" type="number" step="any">
      <button id="calculate" type="button">Посчитать</button>
      <button id="clear" type="button">Очистить</button>
      <p id="result" role="status">Здесь будет результат</p>
    </section>
  </main>

  <footer>Практическая работа по лекциям 52 и 53</footer>
</body>
</html>
